<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oksaesthetic</title>
<meta name="description" content="Oksaesthetic — камерная студия эстетики: уход за кожей, перманентный макияж, лазер и IPL.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
:root{
  --ivory:#F6F1EB; --sand:#EFE7DE; --tan:#E6DACD; --paper:#FFFDFA;
  --ink:#2A2522; --body:#4A403A; --muted:#7A665A; --line:#DCCFC2;
  --clay:#8C5A48; --clay-d:#6E4536; --blush:#D8B4A2;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gut:clamp(16px,5.5vw,80px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:17px;line-height:1.65}
a{color:var(--clay)} a:hover{color:var(--clay-d)}
:focus-visible{outline:2px solid var(--clay);outline-offset:3px}
h1,h2,h3{font-family:var(--serif);font-weight:300;margin:0;text-wrap:balance;line-height:1.02}
p{margin:0}
.wrap{padding-inline:var(--gut);max-width:1440px;margin-inline:auto}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 32px;border-radius:999px;text-decoration:none;font-size:15px;letter-spacing:.05em;font-weight:400;transition:background .2s,color .2s}
.btn-dark{background:var(--ink);color:var(--ivory)} .btn-dark:hover{background:var(--clay);color:#fff}
.btn-line{border:1px solid var(--ink);color:var(--ink)} .btn-line:hover{background:var(--ink);color:var(--ivory)}
.btn-clay{background:var(--clay);color:#fff} .btn-clay:hover{background:var(--clay-d);color:#fff}
.ph{background:var(--tan);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;letter-spacing:.12em;text-align:center;padding:16px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(246,241,235,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:84px}
.brand{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--ink);flex-shrink:0}
.wm{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1;letter-spacing:.26em;padding-left:.26em;white-space:nowrap}
.wm-rule{width:36px;height:1px;background:var(--clay)}
.brand:hover .wm{color:var(--clay)}
.lockup{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.lockup .wm{font-size:clamp(22px,2.4vw,30px);padding-left:0;color:var(--ivory)}
.lockup .wm-rule{width:48px;background:var(--blush)}
.lockup .sub{font-size:11px;letter-spacing:.4em;color:#BBAC9F;font-weight:400}
.foot-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
@media (max-width:640px){.foot-meta{align-items:flex-start;text-align:left}}
nav.links{display:flex;gap:28px;font-size:15px;letter-spacing:.04em}
nav.links a{color:var(--ink);text-decoration:none;font-weight:400} nav.links a:hover{color:var(--clay)}
.right{display:flex;align-items:center;gap:16px}
.lang{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px}
.lang button{height:36px;min-width:44px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:400 13px var(--sans);letter-spacing:.08em;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--ivory)}
.right .btn{min-height:46px;padding:0 24px}
@media (max-width:1180px){nav.links{display:none}}
@media (max-width:560px){.right .btn{display:none}.wm{font-size:16px}.bar{min-height:72px}}
@media (max-width:400px){.wm{font-size:14px;letter-spacing:.22em;padding-left:.22em}.lang button{min-width:40px;padding:0 8px}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(32px,6vw,80px);align-items:center;padding-block:clamp(48px,7vw,96px)}
.hero h1{font-size:clamp(48px,7vw,96px);letter-spacing:-.01em;margin-top:24px}
.hero h1 em{color:var(--clay)}
.hero p{font-size:clamp(17px,1.4vw,19px);color:var(--body);max-width:34em;margin-top:28px}
.ctas{display:flex;flex-wrap:wrap;gap:14px;margin-top:36px}
.arch{display:block;width:100%;height:auto;object-fit:cover;object-position:50% 0%;background:var(--tan);aspect-ratio:560/600;max-width:100%;border-radius:12px}
@media (max-width:820px){.hero{grid-template-columns:1fr}.arch{max-width:420px;width:100%;justify-self:center}}

section{padding-block:clamp(64px,8vw,120px)}
.sand{background:var(--sand)}
.h2{font-size:clamp(40px,4.6vw,68px)}

/* philosophy */
.phil-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,80px);align-items:end}
.phil-top p{color:var(--body);font-size:clamp(17px,1.4vw,19px)}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;margin-top:64px}
.pillar{border-top:1px solid #CDBDAE;padding-top:32px;display:flex;flex-direction:column;gap:10px}
.pillar h3{font-size:30px;font-weight:400}
.pillar p{color:var(--body);font-size:16px}
@media (max-width:820px){.phil-top,.pillars{grid-template-columns:1fr}.pillars{gap:8px;margin-top:40px}}

/* services */
.svc-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:24px}
.svc-head h2{font-size:clamp(48px,5.5vw,76px);margin-top:14px}
.svc-head p{max-width:420px;color:var(--body)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:28px;margin-top:56px}
.card{background:var(--paper);border-radius:12px;padding:18px 18px 32px;display:flex;flex-direction:column;gap:24px}
.card .ph{height:280px;border-radius:10px}
.card .ph.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr);align-items:stretch;justify-items:stretch;align-content:stretch;justify-content:stretch;gap:4px;padding:0;overflow:hidden;background:var(--paper)}
.duo-cell{position:relative;overflow:hidden;min-width:0}
.duo-cell .bg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(16px);opacity:.9}
.duo-cell img{position:absolute;inset:0 0 auto 0;display:block;width:100%;height:80%;object-fit:cover;transition:transform .8s ease}
.card:hover .duo-cell img{transform:scale(1.06)}
.duo-cell span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(255,253,250,.92);color:var(--ink);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:999px;white-space:nowrap;font-weight:400}
@media (prefers-reduced-motion:reduce){.duo-cell img{transition:none}.card:hover .duo-cell img{transform:none}}
.card .ph.photo{padding:0;overflow:hidden}
.card .ph.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 68%;transition:transform .8s ease}
.card:hover .ph.photo img{transform:scale(1.05)}
@media (prefers-reduced-motion:reduce){.card .ph.photo img{transition:none}.card:hover .ph.photo img{transform:none}}
.card-in{padding-inline:14px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:34px;font-weight:400}
.card p{color:var(--body);font-size:16px}
.card ul{list-style:none;margin:0;padding:0 14px;flex-grow:1}
.card li{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #EAE0D5;font-size:16px;font-weight:400}
.card li span:last-child{color:var(--muted);font-weight:300;white-space:nowrap}
.card li .nm{display:flex;flex-direction:column;gap:2px}
.card li .nm em{font-style:normal;font-size:13px;line-height:1.4;color:var(--muted);font-weight:300}
.card li span.pr{color:var(--ink);font-weight:400;white-space:nowrap;font-variant-numeric:tabular-nums}
.card li span.pr small{font-size:12px;color:var(--muted);font-weight:300}
.card li.grp{display:block;padding:26px 0 8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--clay);border-bottom:1px solid #EAE0D5}
.card .btn{margin-inline:14px;min-height:48px;border:1px solid var(--clay);color:var(--clay)}
.card .btn:hover{background:var(--clay);color:#fff}
@media (max-width:980px){.cards{grid-template-columns:1fr;max-width:560px}}

/* process */
.proc{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,6vw,80px)}
.step{display:grid;grid-template-columns:72px minmax(0,1fr);gap:24px;padding-block:30px;border-top:1px solid #CDBDAE}
.step .n{font-family:var(--serif);font-size:44px;line-height:1;color:var(--clay)}
.step h3{font-size:30px;font-weight:400;margin-bottom:6px}
.step p{color:var(--body)}
@media (max-width:820px){.proc{grid-template-columns:1fr}.step{grid-template-columns:52px minmax(0,1fr);gap:16px}.step .n{font-size:34px}}

/* about */
.about{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(32px,6vw,96px);align-items:center}
.about .ph{aspect-ratio:520/620;border-radius:12px;max-width:100%}
.about .master{display:block;width:100%;height:auto;aspect-ratio:520/620;object-fit:cover;object-position:50% 38%;border-radius:12px;max-width:100%;background:var(--tan)}
.about-txt{display:flex;flex-direction:column;gap:24px}
.about-txt p{color:var(--body);font-size:clamp(17px,1.4vw,19px)}
.about blockquote{margin:8px 0 0;font-family:var(--serif);font-style:italic;font-size:clamp(24px,2.4vw,32px);line-height:1.3;color:var(--clay)}
@media (max-width:820px){.about{grid-template-columns:1fr}.about .ph,.about .master{max-width:420px}}

/* reviews */
.revs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:48px}
.rev-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.rev-sum{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:400;letter-spacing:.03em;color:var(--ink);text-decoration:none;border:1px solid #CDBDAE;border-radius:999px;padding:10px 18px;background:var(--paper)}
.rev-sum:hover{border-color:var(--clay);color:var(--clay)}
.stars{color:#B8893A;letter-spacing:.08em}
figcaption{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
figcaption a{font-size:12px;letter-spacing:.06em;text-transform:none;font-weight:400}
figcaption .who .stars{font-size:12px;margin-left:6px}
figure{margin:0;background:var(--paper);border-radius:12px;padding:36px;display:flex;flex-direction:column;gap:24px}
figure .q{font-family:var(--serif);font-size:56px;line-height:.5;color:var(--blush)}
figure blockquote{margin:0;flex-grow:1;color:var(--body)}
figcaption{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
@media (max-width:900px){.revs{grid-template-columns:1fr}}

.card li.more{display:none}
.card.open li.more{display:flex}
.card.open li.grp.more{display:block}
.card .toggle{margin-inline:14px;display:flex;align-items:center;justify-content:center;gap:12px;min-height:48px;background:transparent;border:1px solid var(--clay);color:var(--clay);border-radius:999px;font:400 15px var(--sans);letter-spacing:.04em;cursor:pointer;transition:background .2s,color .2s}
.card .toggle:hover{background:var(--clay);color:#fff}
.card .toggle i{width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.card.open .toggle i{transform:translateY(2px) rotate(-135deg)}
.card .toggle .o{display:none}.card.open .toggle .o{display:inline}.card.open .toggle .c{display:none}
.card .wa-link{align-self:center;font-size:14px;letter-spacing:.04em;font-weight:400}
@media (prefers-reduced-motion:reduce){.card .toggle i{transition:none}}

/* studio */
.studio-grid{display:grid;grid-template-columns:1.35fr 1fr 1fr;grid-template-rows:repeat(2,clamp(220px,22vw,320px));gap:16px;margin-top:48px}
.shot{position:relative;margin:0;padding:0;display:block;border-radius:12px;overflow:hidden;background:var(--tan)}
.shot img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .9s ease}
.shot:hover img{transform:scale(1.03)}
.shot span{position:absolute;left:14px;bottom:14px;background:rgba(255,253,250,.92);color:var(--ink);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:7px 12px;border-radius:999px;font-weight:400}
.shot.s1{grid-column:1;grid-row:1 / span 2;border-radius:12px}
.shot.s2{grid-column:2;grid-row:1 / span 2}
.shot.s3{grid-column:3;grid-row:1}
.shot.s4{grid-column:3;grid-row:2}
.studio-feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;margin-top:40px}
.feat{border-top:1px solid #CDBDAE;padding-top:22px;display:flex;flex-direction:column;gap:8px}
.feat h3{font-size:28px;font-weight:400}
.feat p{color:var(--body);font-size:16px}
@media (max-width:900px){
  .studio-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto;gap:10px}
  .shot.s1{grid-column:1 / span 2;grid-row:auto;aspect-ratio:4/5;max-height:560px}
  .shot.s2,.shot.s3,.shot.s4{grid-column:auto;grid-row:auto;aspect-ratio:3/4}
  .shot.s4{grid-column:1 / span 2;aspect-ratio:16/10}
  .studio-feats{grid-template-columns:1fr;gap:8px}
}
@media (prefers-reduced-motion:reduce){.shot img{transition:none}.shot:hover img{transform:none}}

/* works */
.works{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:48px}
.work{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/5;background:var(--tan)}
.work img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .8s ease}
.work:hover img{transform:scale(1.04)}
.work span{position:absolute;left:14px;bottom:14px;background:rgba(255,253,250,.92);color:var(--ink);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:7px 12px;border-radius:999px;font-weight:400}
a.work-more{display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:28px;background:var(--ink);color:var(--ivory);text-decoration:none;transition:background .3s}
a.work-more:hover{background:var(--clay);color:#fff}
.work-more b{font-family:var(--serif);font-weight:300;font-size:32px;line-height:1.1}
.work-more small{font-size:13px;letter-spacing:.1em;color:#D9CFC5}
@media (max-width:980px){.works{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.work-more b{font-size:24px}}
/* news */
.posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;margin-top:48px}
.post{border-top:1px solid #CDBDAE;padding-top:28px;display:flex;flex-direction:column;gap:14px}
.post .tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);font-weight:400}
.post h3{font-size:32px;font-weight:400;line-height:1.1}
.post p{color:var(--body);font-size:16px}
.news-foot{margin-top:44px}
@media (max-width:900px){.posts{grid-template-columns:1fr;gap:8px}}
@media (prefers-reduced-motion:reduce){.work img{transition:none}.work:hover img{transform:none}}

/* booking */
.dark{background:var(--ink);color:var(--ivory)}
.book{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(40px,6vw,96px);align-items:center}
.book h2{font-size:clamp(52px,6vw,88px)}
.book h2 em{color:var(--blush)}
.book p{color:#D9CFC5;max-width:30em;margin-top:24px;font-size:clamp(17px,1.4vw,19px)}
.book .btn{margin-top:32px;background:var(--ivory);color:var(--ink);min-height:58px}
.book .btn:hover{background:var(--blush)}
dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 28px}
dl div{border-top:1px solid #4A403A;padding-top:18px}
dt{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#BBAC9F;font-weight:400}
dd{margin:8px 0 0;font-family:var(--serif);font-size:24px;overflow-wrap:anywhere}
@media (max-width:820px){.book{grid-template-columns:1fr}}
@media (max-width:420px){dl{grid-template-columns:1fr}}
dd a,footer a{color:inherit;text-underline-offset:4px;text-decoration-thickness:1px}
dd a:hover,footer a:hover{color:var(--blush)}
footer{background:var(--ink);color:#BBAC9F;border-top:1px solid #3D3531;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding-block:36px}
footer .brand span{color:var(--ivory);font-size:24px}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="#top" aria-label="Oksaesthetic">
      <span class="wm">OKSAESTHETIC</span>
      <span class="wm-rule" aria-hidden="true"></span>
    </a>
    <nav class="links" aria-label="Main">
      <a href="#services" data-i="nav.services"></a>
      <a href="#approach" data-i="nav.approach"></a>
      <a href="#about" data-i="nav.about"></a>
      <a href="#works" data-i="nav.works"></a>
      <a href="#news" data-i="nav.news"></a>
      <a href="#booking" data-i="nav.contacts"></a>
    </nav>
    <div class="right">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-es" data-lang="ES">ES</button>
        <button type="button" id="lang-ru" data-lang="RU">RU</button>
        <button type="button" id="lang-en" data-lang="EN">EN</button>
      </div>
      <a class="btn btn-clay" href="#booking" data-i="nav.book"></a>
    </div>
  </div>
</header>

<main id="top">
  <div class="wrap hero">
    <div>
      <div class="eyebrow" data-i="hero.eyebrow"></div>
      <h1><span data-i="hero.title1"></span> <em data-i="hero.titleEm"></em></h1>
      <p data-i="hero.sub"></p>
      <div class="ctas">
        <a class="btn btn-dark" href="#booking" data-i="hero.cta1"></a>
        <a class="btn btn-line" href="#services" data-i="hero.cta2"></a>
      </div>
    </div>
    <img class="arch" src="hero3.jpg" alt="Oksaesthetic" width="560" height="600">
  </div>

  <section id="approach" class="sand">
    <div class="wrap">
      <div class="phil-top">
        <h2 class="h2" data-i="phil.title"></h2>
        <p data-i="phil.text"></p>
      </div>
      <div class="pillars" id="pillars"></div>
    </div>
  </section>

  <section id="studio">
    <div class="wrap">
      <div class="svc-head">
        <div><div class="eyebrow" data-i="studio.eyebrow"></div><h2 data-i="studio.title"></h2></div>
        <p data-i="studio.sub"></p>
      </div>
      <div class="studio-grid" id="studio-grid"></div>
      <div class="studio-feats" id="studio-feats"></div>
    </div>
  </section>

  <section id="services">
    <div class="wrap">
      <div class="svc-head">
        <div><div class="eyebrow" data-i="svc.eyebrow"></div><h2 data-i="svc.title"></h2></div>
        <p data-i="svc.sub"></p>
      </div>
      <div class="cards" id="cards"></div>
    </div>
  </section>

  <section class="sand">
    <div class="wrap proc">
      <h2 class="h2" data-i="proc.title"></h2>
      <div id="steps"></div>
    </div>
  </section>

  <section id="about">
    <div class="wrap about">
      <img class="master" src="master.jpg" alt="Oksaesthetic" width="960" height="1280">
      <div class="about-txt">
        <div class="eyebrow" data-i="about.eyebrow"></div>
        <h2 class="h2" data-i="about.title"></h2>
        <p data-i="about.text"></p>
        <blockquote data-i="about.quote"></blockquote>
      </div>
    </div>
  </section>

  <section id="works" class="sand">
    <div class="wrap">
      <div class="svc-head">
        <div><div class="eyebrow" data-i="works.eyebrow"></div><h2 data-i="works.title"></h2></div>
        <p data-i="works.sub"></p>
      </div>
      <div class="works" id="works-grid"></div>
    </div>

      '</ul>'+(cnt>3?'<button type="button" class="toggle" aria-expanded="false"><span class="c">'+esc(t.svc.show)+' · '+cnt+'</span><span class="o">'+esc(t.svc.hide)+'</span><i aria-hidden="true"></i></button>':'')+
      '<a class="wa-link" href="https://wa.me/34603304615" target="_blank" rel="noopener">'+esc(t.svc.cta)+' ↗</a></article>';}).join("");
  document.getElementById("steps").innerHTML=t.proc.steps.map(function(s,i){return '<div class="step"><div class="n">0'+(i+1)+'</div><div><h3>'+esc(s.title)+'</h3><p>'+esc(s.text)+'</p></div></div>';}).join("");
  var SH=[["studio-cabin.jpg","50% 55%"],["studio-lounge.jpg","50% 62%"],["studio-products2.jpg","50% 50%"],["studio-hall.jpg","50% 55%"]];
  document.getElementById("studio-grid").innerHTML=SH.map(function(h,k){return '<figure class="shot s'+(k+1)+'"><img src="'+h[0]+'" alt="'+esc(t.studio.caps[k])+'" loading="lazy" style="object-position:'+h[1]+'"><span>'+esc(t.studio.caps[k])+'</span></figure>';}).join("");
  document.getElementById("studio-feats").innerHTML=t.studio.feats.map(function(f){return '<div class="feat"><h3>'+esc(f.title)+'</h3><p>'+esc(f.text)+'</p></div>';}).join("");
  var W=[{src:"pmu-lips2.jpg",pos:"50% 50%",label:t.svc.pmuLips},{src:"pmu-brows2.jpg",pos:"50% 50%",label:t.svc.pmuBrows},{src:"skin-facial.jpg",pos:"50% 68%",label:t.works.facial}];
  document.getElementById("works-grid").innerHTML=W.map(function(w){return '<div class="work"><img src="'+w.src+'" alt="'+esc(w.label)+'" loading="lazy" style="object-position:'+w.pos+'"><span>'+esc(w.label)+'</span></div>';}).join("")+
    '<a class="work work-more" href="https://www.instagram.com/oksaesthetic/" target="_blank" rel="noopener"><small>@oksaesthetic</small><b>'+esc(t.works.more)+' ↗</b></a>';
  document.getElementById("posts").innerHTML=t.news.posts.map(function(n){return '<article class="post"><div class="tag">'+esc(n.tag)+'</div><h3>'+esc(n.title)+'</h3><p>'+esc(n.text)+'</p></article>';}).join("");
  document.getElementById("revs").innerHTML=REVIEWS.map(function(r){return '<figure><div class="q" aria-hidden="true">“</div><blockquote lang="'+r.lang+'">'+esc(r.text)+'</blockquote><figcaption><span class="who">'+esc(r.name||t.rev.anon)+'<span class="stars" aria-label="5/5"> ★★★★★</span></span><a href="https://share.google/blsX4wNHZhYPYaRaI" target="_blank" rel="noopener">'+esc(t.rev.link)+' ↗</a></figcaption></figure>';}).join("");
  document.getElementById("contacts").innerHTML=t.book.contacts.map(function(c){return '<div><dt>'+esc(c[0])+'</dt><dd>'+(c[2]?'<a href="'+c[2]+'" target="_blank" rel="noopener">'+esc(c[1])+' ↗</a>':c[1].charAt(0)==="@"?'<a href="https://www.instagram.com/oksaesthetic/" target="_blank" rel="noopener">'+esc(c[1])+'</a>':esc(c[1]))+'</dd></div>';}).join("");
  try{localStorage.setItem("oks-lang-v2",lang);}catch(e){}
}
var start="ES";
try{var s=localStorage.getItem("oks-lang-v2");if(s&&COPY[s])start=s;}catch(e){}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){render(b.dataset.lang);});});
document.getElementById("cards").addEventListener("click",function(e){var b=e.target.closest(".toggle");if(!b)return;var c=b.closest(".card");var o=c.classList.toggle("open");b.setAttribute("aria-expanded",o?"true":"false");});
render(start);
</script>
